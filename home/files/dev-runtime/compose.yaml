services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_EXTRA_DATABASES: ${POSTGRES_EXTRA_DATABASES:-}
      PGDATA: /data/pgdata
      TZ: ${TZ:-Asia/Taipei}
      PGTZ: ${TZ:-Asia/Taipei}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_SOURCE:-postgres-data}:/data
      - ${POSTGRES_INIT_SCRIPT:-/dev/null}:/docker-entrypoint-initdb.d/10-dev-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dragonfly:
    image: ${DRAGONFLY_IMAGE:-docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.0}
    restart: unless-stopped
    ulimits:
      memlock: -1
    ports:
      - "${DRAGONFLY_BIND_ADDRESS:-127.0.0.1}:${DRAGONFLY_PORT:-6379}:6379"
    volumes:
      - ${DRAGONFLY_DATA_SOURCE:-dragonfly-data}:/data
    command:
      - "--logtostderr"
      - "--dir=/data"
      - "--dbfilename=dump"
      - "--snapshot_cron=*/5 * * * *"
      - "--maxmemory=${DRAGONFLY_MAXMEMORY:-1gb}"
      - "--proactor_threads=${DRAGONFLY_THREADS:-2}"
      - "--default_lua_flags=allow-undeclared-keys"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  vmetrics:
    image: ${VMETRICS_IMAGE:-victoriametrics/victoria-metrics:latest}
    profiles: ["vmetrics"]
    restart: unless-stopped
    ports:
      - "${VMETRICS_BIND_ADDRESS:-127.0.0.1}:${VMETRICS_PORT:-8428}:8428"
    volumes:
      - ${VMETRICS_DATA_SOURCE:-vmetrics-data}:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VMETRICS_RETENTION:-30d}"
      - "-httpListenAddr=:8428"

  vlogs:
    image: ${VLOGS_IMAGE:-victoriametrics/victoria-logs:latest}
    profiles: ["vlogs"]
    restart: unless-stopped
    ports:
      - "${VLOGS_BIND_ADDRESS:-127.0.0.1}:${VLOGS_PORT:-9428}:9428"
    volumes:
      - ${VLOGS_DATA_SOURCE:-vlogs-data}:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VLOGS_RETENTION:-7d}"
      - "-httpListenAddr=:9428"

  new-api:
    image: ${NEW_API_IMAGE:-docker.io/calciumion/new-api:v0.13.2}
    profiles: ["new-api"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:-}
      SQLITE_PATH: /data/new-api.db
      ERROR_LOG_ENABLED: "true"
      GIN_MODE: release
    ports:
      - "${NEW_API_BIND_ADDRESS:-127.0.0.1}:${NEW_API_PORT:-23000}:3000"
    volumes:
      - ${NEW_API_DATA_DIR:-/dev/null}:/data
    logging:
      driver: k8s-file
      options:
        max-size: "16mb"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


volumes:
  postgres-data:
  dragonfly-data:
  vmetrics-data:
  vlogs-data:
