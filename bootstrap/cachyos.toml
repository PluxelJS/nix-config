[profiles.desktop]
flake = "ahdg"
features = [
  "fastfetch",
  "ghostty",
  "desktopXdg",
  "fonts",
  "gui",
  "localsend",
  "portal",
  "flatpak",
  "graphics",
  "themeRuntime",
]

[profiles.shell]
flake = "ahdg-shell"
features = ["fonts"]

[profiles.container]
flake = "ahdg-container"
features = []

[packages]
base = ["zsh", "pkgfile", "github-cli"]

[packages.features]
flatpak = ["desktop-file-utils", "flatpak", "flatpak-builder"]
# Portal frontend/backends and the KDE user runtime are Home Manager-owned.
# CachyOS still supplies DBus/systemd, graphics drivers, PipeWire, and Wayland.
portal = []
gui = [
  "ab-download-manager",
  "fcitx5",
  "fcitx5-gtk",
  "fcitx5-qt",
  "fcitx5-rime",
  "gtk3",
  "libappindicator",
  "libayatana-appindicator",
  "python",
  "wlr-randr",
  "dbus",
  "dms-shell",
  "zen-browser-bin",
]
localsend = ["ufw"]

[packages.profiles]
desktop = [
  "base-devel",
  "git",
  "libcap-ng",
  "linux-cachyos-headers",
  "mangohud",
  "openrazer-daemon",
  "openrazer-driver-dkms",
  "podman",
  "podman-desktop",
  "protontricks",
  "python-openrazer",
  "steam",
]

[packages.extras]
gui = ["baloo", "blueman", "easyeffects", "flatseal", "pavucontrol"]

[aurCommands]
mangowm-git = ["mango", "mmsg"]

[aurPackages]
desktop = [
  "clash-party-bin",
  "notepadnext-bin",
  "peazip-qt-bin",
  "polychromatic",
  "wps-office-cn",
  "wps-office-mime-cn",
  "wps-office-mui-zh-cn",
]

[userGroups]
desktop = ["openrazer"]

[browser]
command = "zen-browser"

[flatpaks]
desktop = [
  "com.artemchep.keyguard",
  "com.discordapp.Discord",
  "com.github.PintaProject.Pinta",
  "com.github.jeromerobert.pdfarranger",
  "com.jetbrains.CLion",
  "com.jetbrains.RustRover",
  "com.obsproject.Studio",
  "com.qq.QQ",
  "com.rustdesk.RustDesk",
  "com.teamspeak.TeamSpeak3",
  "com.tencent.WeChat",
  "com.tencent.wemeet",
  "com.thincast.client",
  "com.visualstudio.code",
  "io.github.flattool.Warehouse",
  "io.missioncenter.MissionCenter",
  "org.gnome.Boxes",
  "org.gnome.baobab",
  "org.gnome.eog",
  "org.mozilla.thunderbird_esr",
  "org.telegram.desktop",
]

[localFlatpaks]
desktop = ["io.github.trumank.CodeStudio"]
