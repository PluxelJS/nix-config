## 自启动（exec-once）

# ABDM、Mihomo Party、Zen Browser 和 DMS 均由 Home Manager 生成的 XDG
# autostart entries 管理；Plasma 原生读取，Mango 由 dex 读取。CopyQ 保留为
# 手动回退工具，但其受管 autostart entry 明确禁用，避免和 DMS 争抢剪贴板。
# Baloo 由桌面会话提供的单一服务负责，避免 balooctl 与 systemd 实例竞争。

# 内置屏只跟随合盖状态：开盖亮屏，合盖熄屏；外接屏不参与这个切换。
exec-once=~/.config/mango/scripts/lid-internal-output.sh

# Screen Scale（参考 wiki 的 “not use global scale(recommended)”）
# - 如果你继续用 `monitorrule` 的 `scale`（例如 1.25），下面这段一般不需要
# - 如果你想把 `monitorrule` 的 `scale` 改回 1（更兼容 XWayland），可以启用下面 3 行
# exec-once=/usr/sbin/xwayland-satellite :11 &
# exec-once=sleep 0.5s && echo "Xft.dpi: 120" | xrdb -merge
# exec-once=gsettings set org.gnome.desktop.interface text-scaling-factor 1.25
