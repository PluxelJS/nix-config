## Environment variables managed for the MangoWC session.
## NOTE: MangoWC environment variables reset on `reload_config`.

# Session identity
env=XDG_CURRENT_DESKTOP,mangowc
env=XDG_SESSION_DESKTOP,mangowc
env=DESKTOP_SESSION,mangowc
env=XDG_SESSION_TYPE,wayland

# Keep secrets out of repo-managed Mango config. Export them from your shell or
# a dedicated secret workflow instead of hardcoding them here.

# Wayland/toolkit compatibility
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=GDK_BACKEND,wayland
env=GTK_USE_PORTAL,1
env=MOZ_ENABLE_WAYLAND,1
env=NIXOS_OZONE_WL,1
env=OZONE_PLATFORM,wayland
# NOTE: Avoid overriding XDG_DATA_DIRS here; MangoWC does not guarantee shell-style
# expansion (e.g. "$HOME"), and a bad value can break app discovery/launchers.
#env=PATH,$HOME/.cargo/bin:$PATH

# Theme
env=GTK_THEME,Catppuccin-Macchiato:dark
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,kde
env=XDG_MENU_PREFIX,plasma-

# Screen Scale（参考 wiki：当你“尽量不使用 monitorrule 的 scale”时，用 DPI/字体缩放更兼容 XWayland）
# 1.25x 对应 DPI=120（96*1.25）；若你想 1.4x 则填 140
# env=QT_AUTO_SCREEN_SCALE_FACTOR,1
# env=QT_WAYLAND_FORCE_DPI,120

# Input Method (Fcitx5)
env=INPUT_METHOD,fcitx
env=GLFW_IM_MODULE,ibus
env=XMODIFIERS,@im=fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx

# Cursor
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24

# Helpers
env=BROWSER,zen-browser
env=TERMINAL,ghostty
