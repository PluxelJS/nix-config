## Floating + geometry rules (Hyprland rules.conf equivalents)
##
## Notes:
## - `width/height` are pixels.
## - `offsetx/offsety` are percentages (positive/negative), with 0 meaning centered.

# 重要：mangowc 目前只忽略“整行注释”，同行 `# ...` 可能会导致规则解析失败

# 编辑器：强制不透明 + 禁用 blur（避免字体发糊）
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:^(codium|code|vscodium|com\.visualstudio\.code)$
# Zen：禁用 blur（按需）
windowrule=noblur:1,appid:^zen$

# CopyQ：浮动（避免额外几何规则导致闪烁）
# 说明：mangowc 目前没有“按鼠标位置摆放窗口”的规则参数，只能用固定偏移/居中策略
windowrule=isfloating:1,width:900,height:650,offsetx:75,offsety:-70,appid:^(com\.github\.hluk\.copyq|copyq|CopyQ)$

# SongRec：快速识别歌曲，保持小窗浮动居中
windowrule=isfloating:1,width:960,height:720,offsetx:0,offsety:0,appid:^(songrec|re\.fossplant\.songrec)$

# Dolphin：约 70% 尺寸 + 居中（按 2560x1440）
windowrule=isfloating:1,width:1792,height:1008,offsetx:0,offsety:0,appid:^(org\.kde\.dolphin|dolphin|Dolphin)$

# portal（kde/gtk）
windowrule=isfloating:1,width:1200,height:800,offsetx:0,offsety:0,appid:^org\.freedesktop\.impl\.portal\.desktop\.(kde|gtk)$
# xdg-desktop-portal
windowrule=isfloating:1,width:1200,height:800,offsetx:0,offsety:0,appid:^xdg-desktop-portal(-lxqt)?$
# portal-chooser
windowrule=isfloating:1,width:1100,height:760,offsetx:0,offsety:0,appid:^portal-chooser$
# 常见对话框：标题兜底（可能误伤少量窗口）
windowrule=isfloating:1,width:1100,height:760,offsetx:0,offsety:0,title:.*(Download|下载|保存|打开|设置|选项|属性|Preferences|提示|警告|关于|About).*
# KDE 对话框（含文件选择）
windowrule=isfloating:1,width:1200,height:820,offsetx:0,offsety:0,appid:^org\.kde\.kdialog.*$
# GNOME 归档管理器
windowrule=isfloating:1,width:1100,height:760,offsetx:0,offsety:0,appid:^org\.gnome\.FileRoller$
# 音量控制
windowrule=isfloating:1,width:1000,height:700,offsetx:0,offsety:0,appid:^(pavucontrol|org\.pulseaudio\.pavucontrol)$

# 设备/输入法工具
# 任务管理器（Mission Center）
windowrule=isfloating:1,width:1200,height:800,offsetx:0,offsety:0,appid:^io\.missioncenter\.MissionCenter$
# Polychromatic（Razer）
windowrule=isfloating:1,width:1100,height:750,offsetx:0,offsety:0,appid:^polychromatic$
# Fcitx5 配置工具（Qt）
windowrule=isfloating:1,width:1100,height:750,offsetx:0,offsety:0,appid:^org\.fcitx\.fcitx5-config-qt$
#
# 蓝牙管理（Blueman）
windowrule=isfloating:1,width:1100,height:750,offsetx:0,offsety:0,appid:^blueman-manager$

# KDE Ark：浮动（适当更大）
windowrule=isfloating:1,width:1100,height:760,offsetx:0,offsety:0,appid:^org\.kde\.ark$
# Telegram：命名 Scratchpad + 浮动
# 注意：不要把整个 Telegram appid 强制成 named scratchpad（图片查看等弹窗也会被算进去，导致“主窗口消失/overview 找不到”）
windowrule=isfloating:1,width:1200,height:800,appid:^(org\.telegram\.desktop|telegram-desktop|telegramdesktop)$
# QQ：命名 Scratchpad + 浮动
windowrule=isfloating:1,width:1200,height:800,appid:^(com\.qq\.QQ|QQ)$
# 图片查看（eog）：浮动（适当更大）
windowrule=isfloating:1,width:1200,height:800,offsetx:0,offsety:0,appid:^(org\.gnome\.eog|eog)$

# 下载器：浮动 + 更大窗口
windowrule=isfloating:1,width:1600,height:900,offsetx:0,offsety:0,appid:^com-abdownloadmanager-desktop-AppKt$
# 下载器：标题兜底（添加下载）
windowrule=isfloating:1,width:1200,height:800,offsetx:0,offsety:0,title:^(添加下载)$
# Steam 客户端：浮动
windowrule=isfloating:1,width:1600,height:900,offsetx:0,offsety:0,appid:^steam$
