## Gaming rules
##
## Mirrors your old Hyprland intent:
## - open fullscreen
## - disable blur/shadow/animations/radius/border (reduce overhead & artifacts)
## - allow tearing per-window (optional) for lower latency
##
## Extra goals (Wayland reality / Protontricks):
## - Protontricks/Wine 直接跑的 .exe，很多时候 appid 不会是 `steam_app_<id>`；
##   常见表现是 appid 直接等于 `xxx.exe`，或者是 `wine` / `wine64`。
## - Mango 本身支持“跟随父窗口 tags”：当命中 windowrule 但没有设置 `tags:*` 时，
##   会默认继承父进程窗口的 tags。这里为了稳定/可预期，仍用一个固定“游戏 Tag”
##   做兜底：不管你切到哪，游戏都落在同一个 Tag（避免慢启动时跑到当前视图）。
##
## Debug:
## - 运行 `mmsg -w -c` 或 `~/.config/mango/scripts/dump-active-window.sh`
##   观察实际的 appid/title，再按需把正则收紧或加白名单。

# Tearing(Game mode)
# - `force_tearing:1` 只有在 `allow_tearing` 允许时才会生效
# - 推荐 `2`（FULLSCREEN_ONLY）：只允许全屏窗口 tearing，更安全
allow_tearing=2

# 统一识别“游戏窗口”的 appid 规则：
# - Steam/Proton：steam_app_<appid>
# - Protontricks/Wine：很多是 xxx.exe / wine / wine64
# - 少量 Protontricks 直启 .exe：appid 可能会是 `steam_proton`（WM_CLASS class）
#
# 重要：这里用“稳定的游戏 Tag”来解决：
# 1) 你启动游戏后切到别的 tag，游戏窗口慢慢出来时不会落在你当前看的 tag
# 2) 配合 istagsilent，游戏不会把 view 抢回去
#
# 如果你想换 Tag（例如 6），把下面所有 tags:7 同步改掉，并在 `rules/20-tags.conf`
# 里把 Steam 也改到同一个 Tag。
windowrule=tags:7,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$

# 不强制全屏：是否全屏遵照游戏自身设置（或你手动按 SUPER+f 切换）
windowrule=force_tearing:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$

# 核心修复：阻止游戏在非当前 tag 时抢焦点（不切换 view，不抢输入焦点）
windowrule=istagsilent:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$

# 降开销/降毛边：按需禁用效果
windowrule=noblur:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$
windowrule=isnoshadow:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$
windowrule=isnoborder:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$
windowrule=isnoradius:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$
windowrule=isnoanimation:1,appid:^(steam_app_[0-9]+|steam_proton|wine|wine64|.*\.[eE][xX][eE])$

# Protontricks 直启的一些老 exe 在平铺下容易出现“看起来只有窗口状态变化才刷新”的错觉：
# 让它默认浮动，避免频繁被平铺 resize（你仍可手动 SUPER+f 全屏）。
windowrule=isfloating:1,appid:^steam_proton$
