## Floating + geometry rules (Hyprland rules.conf equivalents)
##
## Notes:
## - `width/height` are pixels.
## - `offset_x/offset_y` are percentages (positive/negative), with 0 meaning centered.

# 重要：mangowc 目前只忽略“整行注释”，同行 `# ...` 可能会导致规则解析失败

# 编辑器：强制不透明 + 禁用 blur（避免字体发糊）
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,no_blur:1,app_id:^(codium|code|vscodium|com\.visualstudio\.code)$
# Zen：禁用 blur（按需）
window_rule=no_blur:1,app_id:^zen$

# CopyQ：浮动（避免额外几何规则导致闪烁）
# 说明：mangowc 目前没有“按鼠标位置摆放窗口”的规则参数，只能用固定偏移/居中策略
window_rule=is_floating:1,width:900,height:650,offset_x:75,offset_y:-70,app_id:^(com\.github\.hluk\.copyq|copyq|CopyQ)$

# SongRec：快速识别歌曲，保持小窗浮动居中
window_rule=is_floating:1,width:960,height:720,offset_x:0,offset_y:0,app_id:^(songrec|re\.fossplant\.songrec)$

# Dolphin：约 70% 尺寸 + 居中（按 2560x1440）
window_rule=is_floating:1,width:1792,height:1008,offset_x:0,offset_y:0,app_id:^(org\.kde\.dolphin|dolphin|Dolphin)$

# portal（kde/gtk）
window_rule=is_floating:1,width:1200,height:800,offset_x:0,offset_y:0,app_id:^org\.freedesktop\.impl\.portal\.desktop\.(kde|gtk)$
# xdg-desktop-portal
window_rule=is_floating:1,width:1200,height:800,offset_x:0,offset_y:0,app_id:^xdg-desktop-portal(-lxqt)?$
# portal-chooser
window_rule=is_floating:1,width:1100,height:760,offset_x:0,offset_y:0,app_id:^portal-chooser$
# 常见对话框：标题兜底（可能误伤少量窗口）
window_rule=is_floating:1,width:1100,height:760,offset_x:0,offset_y:0,title:.*(Download|下载|保存|打开|设置|选项|属性|Preferences|提示|警告|关于|About).*
# KDE 对话框（含文件选择）
window_rule=is_floating:1,width:1200,height:820,offset_x:0,offset_y:0,app_id:^org\.kde\.kdialog.*$
# GNOME 归档管理器
window_rule=is_floating:1,width:1100,height:760,offset_x:0,offset_y:0,app_id:^org\.gnome\.FileRoller$
# 音量控制
window_rule=is_floating:1,width:1000,height:700,offset_x:0,offset_y:0,app_id:^(pavucontrol|org\.pulseaudio\.pavucontrol)$

# 设备/输入法工具
# 任务管理器（Mission Center）
window_rule=is_floating:1,width:1200,height:800,offset_x:0,offset_y:0,app_id:^io\.missioncenter\.MissionCenter$
# Polychromatic（Razer）
window_rule=is_floating:1,width:1100,height:750,offset_x:0,offset_y:0,app_id:^polychromatic$
# Fcitx5 配置工具（Qt）
window_rule=is_floating:1,width:1100,height:750,offset_x:0,offset_y:0,app_id:^org\.fcitx\.fcitx5-config-qt$
#
# 蓝牙管理（Blueman）
window_rule=is_floating:1,width:1100,height:750,offset_x:0,offset_y:0,app_id:^blueman-manager$

# KDE Ark：浮动（适当更大）
window_rule=is_floating:1,width:1100,height:760,offset_x:0,offset_y:0,app_id:^org\.kde\.ark$
# Telegram：浮动
# 注意：不要把整个 Telegram app_id 强制成 named scratchpad（图片查看等弹窗也会被算进去，导致“主窗口消失/overview 找不到”）
window_rule=is_floating:1,width:1200,height:800,app_id:^(org\.telegram\.desktop|telegram-desktop|telegramdesktop)$
# QQ：浮动
window_rule=is_floating:1,width:1200,height:800,app_id:^(com\.qq\.QQ|QQ)$
# 图片查看（eog）：浮动（适当更大）
window_rule=is_floating:1,width:1200,height:800,offset_x:0,offset_y:0,app_id:^(org\.gnome\.eog|eog)$

# 下载器：浮动 + 更大窗口
window_rule=is_floating:1,width:1600,height:900,offset_x:0,offset_y:0,app_id:^com-abdownloadmanager-desktop-AppKt$
# 下载器：标题兜底（添加下载）
window_rule=is_floating:1,width:1200,height:800,offset_x:0,offset_y:0,title:^(添加下载)$
# Steam 客户端：浮动
window_rule=is_floating:1,width:1600,height:900,offset_x:0,offset_y:0,app_id:^steam$
