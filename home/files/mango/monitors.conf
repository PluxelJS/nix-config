## Monitor rules
## Format: monitorrule=name:<regex>,width:<px>,height:<px>,refresh:<Hz>,x:<px>,y:<px>,scale:<factor>,rr:<transform>,vrr:<0|1>

## 27-inch 4K display at work.
monitorrule=name:^DP-2$,width:3840,height:2160,refresh:120,x:0,y:0,scale:2,rr:0,vrr:0

## 27-inch 1440p display at home; HDMI connector numbering may vary.
monitorrule=name:^HDMI.*$,width:2560,height:1440,refresh:120,x:0,y:0,scale:1.25,rr:0,vrr:0
