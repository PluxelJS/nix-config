[profiles.desktop]
flake = "ahdg"
features = [
  "fastfetch",
  "ghostty",
  "desktopXdg",
  "fonts",
  "gui",
  "portal",
  "flatpak",
  "graphics",
  "themeRuntime",
]

[profiles.shell]
flake = "ahdg-shell"
features = ["fonts"]

[profiles.container]
flake = "ahdg-container"
features = []

[packages]
base = ["zsh", "pkgfile"]

[packages.features]
flatpak = ["flatpak"]
portal = ["xdg-desktop-portal", "xdg-desktop-portal-kde"]
gui = [
  "fcitx5",
  "fcitx5-gtk",
  "fcitx5-qt",
  "fcitx5-rime",
  "wlr-randr",
  "kservice",
  "polkit-kde-agent",
  "plasma-workspace",
  "dbus",
]

[packages.profiles]
desktop = ["podman"]

[packages.extras]
gui = ["baloo", "copyq", "dolphin"]

[aurCommands]
mangowc = ["mango", "mmsg"]
dms-shell = ["dms"]

[browser]
command = "zen-browser"
note = "Install your preferred browser and keep BROWSER_CMD / BROWSER_DESKTOP_ID aligned with home/files/mango/scripts/browser-activate.sh."

[flatpaks]
desktop = [
  "io.missioncenter.MissionCenter",
  "org.gnome.eog",
  "org.telegram.desktop",
]
