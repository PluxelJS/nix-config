## 自启动（exec-once）

# KDE 文件索引（从 Hyprland 迁移）
exec-once=balooctl6 enable

# CopyQ：只启动服务端（避免弹 UI / 闪烁），并显式带上 KDE/Qt 主题环境
exec-once=sh -c 'QT_QPA_PLATFORMTHEME=kde KDE_SESSION_VERSION=6 KDE_FULL_SESSION=true copyq --start-server'

# ABDM：托盘/浏览器接管由 Home Manager helper 统一处理
exec-once=sh -c '~/.local/bin/abdm-tray >/dev/null 2>&1 || true'

# Mihomo Party：当前代理 UI 和 clash/mihomo scheme handler
exec-once=sh -c 'if command -v mihomo-party >/dev/null 2>&1 && ! pgrep -x mihomo-party >/dev/null 2>&1; then mihomo-party >/dev/null 2>&1 & fi'

# Zen Browser：保留当前的后台预热行为
exec-once=sh -c 'command -v zen-browser >/dev/null 2>&1 && zen-browser --silent >/dev/null 2>&1 &'

# 内置屏只跟随合盖状态：开盖亮屏，合盖熄屏；外接屏不参与这个切换。
exec-once=~/.config/mango/scripts/lid-internal-output.sh

# Screen Scale（参考 wiki 的 “not use global scale(recommended)”）
# - 如果你继续用 `monitorrule` 的 `scale`（例如 1.25），下面这段一般不需要
# - 如果你想把 `monitorrule` 的 `scale` 改回 1（更兼容 XWayland），可以启用下面 3 行
# exec-once=/usr/sbin/xwayland-satellite :11 &
# exec-once=sleep 0.5s && echo "Xft.dpi: 120" | xrdb -merge
# exec-once=gsettings set org.gnome.desktop.interface text-scaling-factor 1.25
