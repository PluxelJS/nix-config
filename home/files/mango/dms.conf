## Dank Material Shell (DMS) for MangoWC
## 参考：danklinux 文档（mangowc configuration）

# 仅同步会话/Wayland 相关变量到 systemd --user；KDE portal 自身的 Qt 主题
# 由 Nix 包装后的 xdg-desktop-portal-kde 提供，不再依赖这里的显式补丁。
exec-once=sh -c 'dbus-update-activation-environment --systemd XDG_MENU_PREFIX WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP DESKTOP_SESSION ELECTRON_OZONE_PLATFORM_HINT GDK_BACKEND GTK_IM_MODULE GTK_THEME GTK_USE_PORTAL INPUT_METHOD MOZ_ENABLE_WAYLAND NIXOS_OZONE_WL OZONE_PLATFORM QT_IM_MODULE QT_IM_MODULES QT_QPA_PLATFORM SDL_IM_MODULE GLFW_IM_MODULE XMODIFIERS XCURSOR_THEME XCURSOR_SIZE'
exec-once=sh -c 'XDG_MENU_PREFIX=arch- kbuildsycoca6 --noincremental'
# 如果 dms/portal 是上一个 Wayland 会话启动的，它们可能还指向旧的 WAYLAND_DISPLAY
# 这里在 Mango 会话内重启一次，确保 UI/快捷键正常
exec-once=systemctl --user restart xdg-desktop-portal.service

# 启动 Mango 会话 target（见 `~/.config/systemd/user/mango-session.target`）。
# Keep this after environment import so XDG autostart units inherit the session.
exec-once=systemctl --user start mango-session.target

# DMS 相关规则
env=DMS_DISABLE_POLKIT,1
exec-once=/usr/lib/polkit-kde-authentication-agent-1
exec-once=dms run
# XEmbed tray -> StatusNotifier bridge (Wayland):
# - Java/AWT SystemTray（ABDownloadManager 等）经常走 XEmbed，需要这个桥才能在 DMS 托盘里出现。
exec-once=sh -c 'sleep 1; pgrep -x xembedsniproxy >/dev/null 2>&1 || xembedsniproxy'
layerrule=noanim:1,layer_name:^dms
# 选择/框选层：禁用 blur（截图/选区更清晰）
layerrule=noblur:1,noanim:1,layer_name:selection
# DMS/Quickshell：强制浮动（尺寸尽量尊重应用自己的 size-hint）
windowrule=isfloating:1,appid:^org\.quickshell$
