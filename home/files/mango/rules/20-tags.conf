## Tag assignment (Hyprland workspace rules equivalents)

# 浏览器固定到 Tag 4：
# - `SUPER+b` 只需要切到浏览器 Tag；有窗口时不再重复 spawn。
# - 首次打开时由绑定脚本先切到 Tag 4，再启动 Zen。
windowrule=tags:4,appid:^zen$

# 常驻工具（按需调整）
windowrule=tags:8,appid:^(org\.telegram\.desktop|telegram-desktop|telegramdesktop)$
windowrule=istagsilent:1,appid:^(org\.telegram\.desktop|telegram-desktop|telegramdesktop)$
windowrule=tags:9,appid:^(com\.qq\.QQ|QQ)$

# 游戏（Steam + Proton/Wine）
# - 这里把 Steam 固定到 Tag 7：配合 `rules/90-games.conf` 里“游戏窗口 tags:7”
#   才能做到你启动游戏后即使切走，游戏也不会跑到你当前看的 tag 里。
windowrule=tags:7,appid:^steam$

