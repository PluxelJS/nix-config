## MangoWC main config
## Keep this file tiny: it only composes other files.
##
## Keybind mnemonic (触类旁通)
## - SUPER: “操作/调用” (focus/toggle/open)
## - SHIFT: “更改语义” (交换/发送/编辑排布)
## - CTRL: “查看/导航语义” (在有窗口的 tag 间跳、快速浏览)
## - ALT:  “几何/调节语义” (比例/大小等连续调整)
##
## Recommended mental model:
## - SUPER + 方向：聚焦
## - SUPER + SHIFT + 方向：交换位置（平铺编辑排布）
## - SUPER + ALT + 方向：调整大小（浮动几何）
## - SUPER + SHIFT + ALT + 方向：移动窗口（浮动几何）

# Base defaults shipped by the system package.
#source=/etc/mango/config.conf

enable_hotarea=0
allow_shortcuts_inhibit=0

# User overrides (split by concern).
source=~/.config/mango/env.conf
source=~/.config/mango/appearance.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/startup.conf
source=~/.config/mango/rules.conf

##! 启动应用（Applications）
# 终端（Terminal）
bind=SUPER,t,spawn,ghostty
# 文件管理器（File Manager）
bind=SUPER,e,spawn,dolphin
# 浏览器（Browser）
bind=SUPER,b,spawn_shell,~/.config/mango/scripts/browser-activate.sh
# 剪贴板面板（Clipboard）
bind=Ctrl,grave,spawn,@DMS@ ipc call clipboard toggle
# 听歌识别（SongRec）
bind=SUPER+SHIFT,m,spawn,songrec gui-norecording
# 下载器（ABDownloadManager）
# - `SUPER+d`：确保后台已启动（UI 需要从 tray 点开）
bind=SUPER,d,spawn_shell,~/.local/bin/abdm-open

# Screenshot (mark-shot)
# Ctrl+F1：区域截图 -> 进入 Mark Shot，默认 `move`
bind=Ctrl,F1,spawn_shell,~/.config/mango/scripts/screenshot.sh region clip
# Shift+F1：区域截图 -> 进入 Mark Shot，默认 `pen`
bind=SHIFT,F1,spawn_shell,~/.config/mango/scripts/screenshot.sh region annotate
# Shift+F3：全屏截图 -> 进入 Mark Shot，默认 `pen`
bind=SHIFT,F3,spawn_shell,~/.config/mango/scripts/screenshot.sh screen annotate

##! DMS（面板/小组件）
###! 常用面板
# 控制中心（Control Center）
bind=SUPER,p,spawn,dms ipc call control-center toggle
# 通知中心（Notifications）
bind=SUPER,n,spawn,dms ipc call notifications toggle
# 设置（Settings）
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
# 便签/记事本（Notepad）
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggle

###! 任务/电源
# 任务管理器（Task Manager）
bind=CTRL+ALT,Delete,spawn,io.missioncenter.MissionCenter
# 电源菜单（Power Menu）
bind=SUPER,Delete,spawn,dms ipc call powermenu toggle
# 直接锁屏（Lock）
bind=SUPER,l,spawn,dms ipc call lock lock
# 休眠/睡眠（Suspend）
bind=SUPER+SHIFT,l,spawn,systemctl suspend

###! 多媒体（音量/亮度/播放控制）
# 你的“旋钮”大概率会发这些键（如果没反应，用 wev 查旋钮输出的键名再加 bind）
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bindl=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bindl=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""
bindl=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioNext,spawn,dms ipc call mpris next
bindl=NONE,XF86AudioPrev,spawn,dms ipc call mpris previous

###! 速查
# 快捷键一览（Cheatsheet）
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle mangowc

###! 调试
# 记录当前聚焦窗口关键信息（追加写入）到 ~/.cache/mango/active-windows.log
# 同时保存原始 dump 到 ~/.cache/mango/active-window/<时间>.txt（便于回溯）
bind=CTRL+SHIFT,Delete,spawn,~/.config/mango/scripts/dump-active-window.sh
# 剪贴板图片排查：手动运行 `~/.config/mango/scripts/clipboard-image-dump.sh` 输出实际类型/尺寸

##! 会话（Session）
# 重载配置（Reload Config）
bind=SUPER+SHIFT,r,reload_config,
# 退出 MangoWC（Quit, 防误触）
bind=SUPER+CTRL+SHIFT,e,quit,

##! 快捷键（操作/导航/窗口/布局）
###! 总览 / 切窗
# 搜索（Spotlight，保留 Win+Tab 习惯）
bind=SUPER,Tab,spawn,dms ipc call spotlight toggle
# 快速总览
bind=SUPER,space,toggleoverview,
# 互相切回最近窗口
bind=Alt,Tab,focuslast

###! 导航（焦点/工作区/显示器）
# 方向聚焦（方向键优先）
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
# Win + 滚轮：在 scroller 下当作 Win + 左右（切窗口/焦点）
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right

# 有窗口的 Tag 导航
# Win + Shift + 滚轮：移动窗口
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0
bind=SUPER+SHIFT,UP,exchange_client,left
bind=SUPER+SHIFT,DOWN,exchange_client,down
# Win + CTRL + 滚轮：切工作区（只在有窗口的 Tag 间跳）
axisbind=SUPER+CTRL,UP,viewtoleft_have_client
axisbind=SUPER+CTRL,DOWN,viewtoright_have_client


# 工作区（Tags）
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,0,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# 显示器（Monitors）
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right

###! 窗口管理（Window）
# 关闭/浮动/全屏
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,spawn_shell,sh ~/.config/mango/scripts/force-kill-focused.sh
bind=SUPER,w,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,m,togglemaximizescreen,
# `global`：跨所有 Tag 可见；`overlay`：始终在顶层
bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,g,toggleoverlay,
# 居中当前窗口（浮动/Scroller）
bind=SUPER,c,centerwin,

# Scratchpad
bind=SUPER+SHIFT,s,minimized,
bind=SUPER,i,restore_minimized
bind=SUPER,s,toggle_scratchpad

# 编辑排布（平铺：交换位置）
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# 浮动几何（移动/缩放：像素级）
bind=SUPER+SHIFT+ALT,Left,movewin,-50,0
bind=SUPER+SHIFT+ALT,Down,movewin,0,50
bind=SUPER+SHIFT+ALT,Up,movewin,0,-50
bind=SUPER+SHIFT+ALT,Right,movewin,50,0
bind=SUPER+ALT,Left,resizewin,-50,0
bind=SUPER+ALT,Down,resizewin,0,50
bind=SUPER+ALT,Up,resizewin,0,-50
bind=SUPER+ALT,Right,resizewin,50,0
# 浮动窗口预设尺寸（把“很小的浮动窗口”一键放大）
bind=SUPER+ALT,Return,resizewin,1400,900
bind=SUPER+ALT+SHIFT,Return,resizewin,1600,900

# 鼠标拖动（移动/缩放）
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

###! 布局 / Scroller
circle_layout=tile,scroller
# 当前 tag：tile ↔ scroller 轮换
bind=SUPER,r,switch_layout,
# scroller：窗口比例预设轮换
bind=SUPER+ALT,r,switch_proportion_preset,
bind=SUPER+ALT,e,set_proportion,1.0
bind=SUPER+ALT,x,set_proportion,0.5
# 间距开关（不常用）
bind=SUPER+ALT,g,togglegaps

###! Master-Stack（非 scroller 时更有用）
bind=SUPER+SHIFT,Return,zoom
bind=SUPER+ALT,h,setmfact,-10
bind=SUPER+ALT,l,setmfact,+10

source=./dms/cursor.conf
source=./dms/colors.conf
source=./dms/layout.conf
source=./dms.conf
