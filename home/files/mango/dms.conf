## Dank Material Shell (DMS) for MangoWC
## 参考：danklinux 文档（mangowc configuration）

# Import the session environment, start services, then run shared XDG autostart.
# This sequence must complete in order; separate exec_once lines run concurrently.
exec_once=sh -c 'exec "$HOME/.local/bin/ahdg-mango-session-start"'
exec_once=sh -c 'XDG_MENU_PREFIX=plasma- "$HOME/.nix-profile/bin/kbuildsycoca6" --noincremental'

# DMS 相关规则（DMS 本身由 mango-session.target 下的 systemd 用户服务启动）
env=DMS_DISABLE_POLKIT,1
# Home Manager starts the Nix-owned KDE PolicyKit agent with mango-session.target.
layer_rule=no_animation:1,layer_name:^dms
# 选择/框选层：禁用 blur（截图/选区更清晰）
layer_rule=no_blur:1,no_animation:1,layer_name:selection
# DMS/Quickshell：强制浮动（尺寸尽量尊重应用自己的 size-hint）
window_rule=is_floating:1,app_id:^org\.quickshell$
